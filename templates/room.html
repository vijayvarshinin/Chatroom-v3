{%extends 'base.html' %}
{% block content %}
<div class="chat-container">
  <!-- Sidebar Section -->
  <aside class="sidebar">
    <!-- Active Room Header -->
    <section class="sidebar-section">
      <h2 class="sidebar-title">Current Room</h2>
      <ul class="sidebar-list">
        <li class="sidebar-item room active">
          <span class="hashtag">#</span> {{ code }}
        </li>
      </ul>
    </section>

<!-- Dynamic Active Users List -->
    <section class="sidebar-section">
      <h2 class="sidebar-title">Active Users — <span id="user-count">0</span></h2>
      <ul class="sidebar-list" id="user-list">
      </ul>
    </section>
  </aside>
 
<div class="message-box">
    <h2>Chat Room: {{code}}</h2>
    <div class="messages" id="messages"></div>
        <div class="inputs">
            <input type="text" rows="3" placeholder="Message" name="message" id="message" />
            <button type="button" name="send" id="button-send" onclick="sendMessages()">
                Send
            </button>
        </div>
    </div>
</div>

<script type="text/javascript">
    var socketio = io();

    const messages = document.getElementById("messages");

    const createMessage = (name, msg) => {
        const content = `
            <div class="text">
                <span>
                    <strong>${name}</strong>: ${msg}
                </span>
                <span class="muted">
                  ${new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' , hour12: true})}
                </span>
            </div>
    `
    ;
    messages.innerHTML += content;
    messages.scrollTop = messages.scrollHeight; // Auto-scrolling to bottom of the screen
    };

    socketio.on("message", (data) => {
        createMessage(data.name, data.message);
    });

    // Listen for Active Users Updates from Flask
    socketio.on("update_users", (data) => {
        const userList = document.getElementById("user-list");
        const userCount = document.getElementById("user-count");

        userList.innerHTML = "";
        userCount.innerText = data.users.length;

        data.users.forEach((user) => {
            const li = document.createElement("li");
            li.className = "sidebar-item user";
            li.innerHTML = `
            <span class="status-dot"></span>
            <span class="username">${user}</span>
        `;
        userList.appendChild(li);
        });
    });

    //send message event 
    const sendMessages = () => {
       const message = document.getElementById("message");
       if (message.value == "") return;
       socketio.emit("message", {data: message.value})
       message.value="";
    };

    // sending message via the enter key
    document.getElementById("message").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
        event.preventDefault();
        sendMessages();
        }
    });
</script>

{% for msg in messages %}
    <script type="text/javascript">
        createMessage("{{msg.name}}","{{msg.message}}")
    </script>
{% endfor %}
{% endblock %}
