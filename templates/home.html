{% extends 'base.html' %}
{% block content %}
<!--creating a form-->
<form method="post" class="chatroom">
    <h3>Enter the Chat Room</h3>
    <div>
        <input type="text" placeholder="Enter your Name" name="name" value="{{name}}"/>
    </div>
    <div class="join">
        <input type="text" placeholder="Room Code" name="code" value="{{code}}"/>
        <button type="submit" name="join"> Join a Room</button>        
    </div>
        <button type="submit" name="create" class="create-button"> Create a Room</button>
        {% if error %}
        <ul>
            <li>{{error}}</li>
        </ul>
        {% endif %}
</form>

{% endblock %}
